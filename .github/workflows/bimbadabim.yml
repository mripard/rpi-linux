  hdmi-test-arm64-pi4:
    name: HDMI Capture Test for the RaspberryPi4, on ARM64
    runs-on: [self-hosted, linux, arm64, pi4]
    # needs: build-arm64
    env:
      KASA_IP: 192.168.20.50

    steps:
      # - name: Setup Python
