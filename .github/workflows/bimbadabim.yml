      - name: Power off the DUT
        if: always()
        run: |
          kasa --username ${{ secrets.KASA_USERNAME }} --password ${{ secrets.KASA_PASSWORD }} --host ${{ env.KASA_IP }} off

      - name: Remove Test Artifacts
        if: always()
        run: |
          rm -rf /home/runner/tftp/files/test
