      - name: Power the DUT
        run: |
          kasa --username ${{ secrets.KASA_USERNAME }} --password ${{ secrets.KASA_PASSWORD }} --host ${{ env.KASA_IP }} off
          kasa --username ${{ secrets.KASA_USERNAME }} --password ${{ secrets.KASA_PASSWORD }} --host ${{ env.KASA_IP }} on

      # - name: Start HDMI Capture
